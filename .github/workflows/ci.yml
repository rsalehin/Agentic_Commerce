name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies (frozen, with dev group)
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (gateway, strict)
        run: uv run mypy gateway

      - name: Pytest
        run: uv run pytest -q
