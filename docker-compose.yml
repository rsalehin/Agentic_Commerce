# Starts the four services. The three Python backends share one image
# (built once, reused); the UI runs the Vite dev server. Health endpoints on
# the backends; the UI has none in Phase 0 (it only needs to bind 5174).

x-backend: &backend
  build: .
  image: agentic-depot-backend:local
  restart: unless-stopped

services:
  gateway:
    <<: *backend
    command: ["python", "-m", "gateway.app"]
    environment:
      HOST: "0.0.0.0"
      GATEWAY_PORT: "8080"
      PROVIDER_DOMAIN: "https://fonds-ag.example"
      IDENTITY_VERIFIER: "wallet_sdjwt"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  wallet:
    <<: *backend
    command: ["python", "-m", "wallet.app"]
    environment:
      HOST: "0.0.0.0"
      WALLET_PORT: "8081"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  core:
    <<: *backend
    command: ["python", "-m", "core.app"]
    environment:
      HOST: "0.0.0.0"
      CORE_PORT: "8082"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  runner:
    <<: *backend
    command: ["python", "-m", "agent.runner"]
    environment:
      HOST: "0.0.0.0"
      RUNNER_PORT: "8083"
      GATEWAY_URL: "http://gateway:8080"
    ports:
      - "8083:8083"
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ui:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./ui:/app
    ports:
      - "5174:5174"
    depends_on:
      - gateway
      - wallet
      - core
      - runner
