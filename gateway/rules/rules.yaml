# Rules catalogue — every rule cites its legal basis. Loaded by gateway/rules/engine.py.
# outcome: OK | WARN | HUMAN_REQUIRED | REJECT | ERROR
#   WARN            continues;
#   HUMAN_REQUIRED  blocks, stores blocked_from, creates an escalation;
#   REJECT          terminates the session (transition to REJECTED);
#   ERROR           guard rejection: returns the error envelope, leaves state unchanged, is retryable
#                   (see docs/03 "Guards"). Marked with `guard: true`.
# `when` is a Python expression over the step context (ctx) evaluated by the engine in a restricted namespace.
# `reason_code` must exist in docs/03_state-machine.md.

- id: R-MND-01
  step: any
  guard: true
  law: "BGB §§ 164 ff. (Zurechnung), Mandatsmodell; AP2-Mandate als Vorbild"
  description: "Every tool call must stay within the signed mandate scope (product classes, amounts, data release). Pre-rule guard: returns the error envelope, state unchanged, retryable."
  when: "not ctx.call_within_scope"
  outcome: ERROR
  reason_code: MANDATE_SCOPE_EXCEEDED
  message_de: "Die Anfrage überschreitet das vom Kunden erteilte Mandat."

- id: R-MND-02
  step: any
  guard: true
  law: "GwG §10 Abs. 1 Nr. 5 (Aktualität), Mandatsmodell"
  description: "Mandate must not be expired. Pre-rule guard: returns the error envelope, state unchanged, retryable (obtain a fresh mandate)."
  when: "ctx.mandate.exp < ctx.now"
  outcome: ERROR
  reason_code: MANDATE_EXPIRED
  message_de: "Das Mandat ist abgelaufen. Bitte neu erteilen."

- id: R-MND-03
  step: any
  law: "Mandatsmodell (Widerruflichkeit)"
  description: "Mandate must not be on the holder's revocation list."
  when: "ctx.mandate.jti in ctx.revoked_mandates"
  outcome: REJECT
  reason_code: MANDATE_REVOKED
  message_de: "Das Mandat wurde widerrufen."

- id: R-MND-04
  step: start
  law: "AMLR Art. 20 Abs. 1 lit. i (im Namen des Kunden Handelnde); AI Act Art. 50 (Transparenz)"
  description: "Agent must identify itself and bind to the verified card fingerprint."
  when: "not ctx.agent_id or ctx.card_fingerprint != ctx.provider_card_fingerprint"
  outcome: REJECT
  reason_code: AGENT_UNVERIFIED
  message_de: "Der Agent konnte nicht verifiziert werden."

- id: R-ID-01
  step: identify
  law: "GwG §12 Abs. 1, §13 Abs. 1; AMLR Art. 22 Abs. 6 lit. b (eIDAS-konforme Identifizierung)"
  description: "PID presentation must verify (issuer signature, key binding, nonce, audience) at assurance level high/substantial."
  when: "not ctx.presentation.valid or ctx.presentation.assurance_level not in ('high','substantial')"
  outcome: HUMAN_REQUIRED
  reason_code: ID_VERIFICATION_FAILED
  message_de: "Die Identität konnte nicht elektronisch bestätigt werden."

- id: R-ID-02
  step: identify
  law: "AMLR Art. 22 Abs. 6; RTS Art. 7 (Ausnahme nur wenn eIDAS-Mittel nicht verfügbar)"
  description: "Non-EU/EEA nationality without eIDAS credential → fallback identification by a human."
  when: "not any(n in ctx.eu_eea for n in ctx.kyc.nationalities) and ctx.presentation.issuer_trust != 'eidas'"
  outcome: HUMAN_REQUIRED
  reason_code: ID_NON_EU_DOCUMENT
  message_de: "Für Ausweisdokumente außerhalb EU/EWR ist eine persönliche Identifizierung erforderlich."

- id: R-ID-03
  step: identify
  law: "BGB §§ 106 ff. (beschränkte Geschäftsfähigkeit)"
  description: "Minors cannot open a Depot via agent."
  when: "ctx.kyc.age < 18"
  outcome: HUMAN_REQUIRED
  reason_code: ID_UNDERAGE
  message_de: "Minderjährige können ein Depot nur mit gesetzlichen Vertretern eröffnen."

- id: R-ID-04
  step: identify
  law: "GwG §10 Abs. 1 Nr. 1 i.V.m. Referenzkontoprinzip"
  description: "Reference account holder must match identified person."
  when: "ctx.reference_account and not ctx.reference_account.name_match"
  outcome: HUMAN_REQUIRED
  reason_code: NAME_MISMATCH_REFERENCE_ACCOUNT
  message_de: "Der Kontoinhaber des Referenzkontos stimmt nicht mit der identifizierten Person überein."

- id: R-ID-05
  step: identify
  law: "BGB §§ 164 ff. (Zurechnung); Mandatsmodell — Bindung des Mandats an die identifizierte Person"
  description: "The PID key binding (cnf) must equal the mandate signer (iss); otherwise the agent is presenting a third party's identity under this mandate."
  when: "ctx.pid_cnf_kid != ctx.mandate.iss_kid"
  outcome: REJECT
  reason_code: HOLDER_MANDATE_MISMATCH
  message_de: "Die identifizierte Person stimmt nicht mit dem Aussteller des Mandats überein."

- id: R-AML-01
  step: identify
  law: "EU-Sanktionsverordnungen; GwG §10 Abs. 1 Nr. 5"
  description: "Sanctions screening hit blocks."
  when: "ctx.screening.sanctions == 'hit'"
  outcome: REJECT
  reason_code: AML_SANCTIONS_HIT
  message_de: "Die Depoteröffnung kann nicht fortgesetzt werden."

- id: R-AML-02
  step: identify
  law: "GwG §15 Abs. 3 Nr. 1 (verstärkte Sorgfaltspflichten bei PEP)"
  description: "PEP hit requires enhanced due diligence by a human."
  when: "ctx.screening.pep == 'hit'"
  outcome: HUMAN_REQUIRED
  reason_code: AML_PEP_HIT
  message_de: "Es sind zusätzliche Prüfungen durch einen Mitarbeiter erforderlich."

- id: R-AML-03
  step: identify
  law: "GwG §15 Abs. 3 Nr. 2 (Drittstaaten mit hohem Risiko)"
  description: "Residence or nationality in a high-risk third country."
  when: "any(c in ctx.high_risk_countries for c in ctx.kyc.nationalities + [ctx.kyc.address.country])"
  outcome: HUMAN_REQUIRED
  reason_code: AML_HIGH_RISK_COUNTRY
  message_de: "Aufgrund des Länderrisikos ist eine manuelle Prüfung erforderlich."

- id: R-TAX-01
  step: tax_declaration
  law: "AO §139b; EStG §44a"
  description: "German tax ID must be present."
  when: "not ctx.declaration.tax_id"
  outcome: HUMAN_REQUIRED
  reason_code: TAX_ID_MISSING
  message_de: "Ohne Steuer-Identifikationsnummer kann das Depot nicht eröffnet werden."

- id: R-TAX-02
  step: tax_declaration
  law: "FKAustG §3a Abs. 2 (CRS-Selbstauskunft)"
  description: "Any tax residency outside Germany requires manual CRS handling in the MVP."
  when: "any(r.country != 'DE' for r in ctx.declaration.residencies)"
  outcome: HUMAN_REQUIRED
  reason_code: TAX_FOREIGN_RESIDENCY
  message_de: "Bei steuerlicher Ansässigkeit im Ausland prüft ein Mitarbeiter die Selbstauskunft."

- id: R-TAX-03
  step: tax_declaration
  law: "FATCA-Abkommen DE/USA; FATCA-USA-UmsV"
  description: "US indicia require W-9/W-8BEN handling."
  when: "ctx.declaration.us_person or 'US' in ctx.kyc.nationalities or ctx.kyc.birth_place_country == 'US'"
  outcome: HUMAN_REQUIRED
  reason_code: TAX_US_INDICIA
  message_de: "Bei US-Bezug sind zusätzliche Formulare (W-9/W-8BEN) erforderlich."

- id: R-TAX-04
  step: tax_declaration
  law: "FKAustG §3a Abs. 2 (Erklärung des Kontoinhabers); BGB Zurechnung"
  description: "The self-certification must be signed by the customer's holder key, not by the agent."
  when: "not ctx.holder_signature_valid"
  outcome: HUMAN_REQUIRED
  reason_code: TAX_DECLARATION_UNSIGNED
  message_de: "Die steuerliche Selbstauskunft muss vom Kunden selbst bestätigt werden."

- id: R-WPHG-01
  step: appropriateness
  law: "WpHG §63 Abs. 10 (Angemessenheitsprüfung); MaComp BT 6"
  description: "Requested product classes must be within unlocked classes; otherwise warn and require human."
  when: "any(c not in ctx.unlocked_classes for c in ctx.profile.requested_classes)"
  outcome: HUMAN_REQUIRED
  reason_code: PRODUCT_OUTSIDE_UNLOCKED
  message_de: "Für die gewünschten Produktklassen liegen keine ausreichenden Kenntnisse und Erfahrungen vor (Warnhinweis nach §63 Abs. 10 WpHG)."

- id: R-WPHG-02
  step: appropriateness
  law: "WpHG §64 Abs. 3 (Geeignetheitsprüfung bei Anlageberatung)"
  description: "Advice is not offered in the agent channel; route to partner-bank adviser."
  when: "ctx.mandate.scope.advice_allowed or ctx.profile.advice_requested"
  outcome: HUMAN_REQUIRED
  reason_code: ADVICE_REQUESTED
  message_de: "Eine Anlageberatung erfolgt durch Ihre Partnerbank. Wir vermitteln einen Termin."

- id: R-WPHG-03
  step: appropriateness
  law: "WpHG §63 Abs. 11 (Execution-only nur für nicht-komplexe Instrumente)"
  description: "Complex products are never opened autonomously."
  when: "any(c in ('derivate','zertifikate') for c in ctx.profile.requested_classes)"
  outcome: HUMAN_REQUIRED
  reason_code: COMPLEX_PRODUCT
  message_de: "Komplexe Finanzinstrumente sind im Agentenkanal nicht autonom freischaltbar."

- id: R-CTR-01
  step: sign_contract
  law: "BGB §§ 312c ff. (Fernabsatz), eIDAS Art. 25 (QES); Zurechnung der Willenserklärung"
  description: "Contract hash must be signed by the holder key (mock QES)."
  when: "not ctx.holder_signature_valid or ctx.signed_contract_hash != ctx.contract_hash"
  outcome: HUMAN_REQUIRED
  reason_code: CONTRACT_UNSIGNED
  message_de: "Der Depotvertrag muss vom Kunden persönlich signiert werden."
